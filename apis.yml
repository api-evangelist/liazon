name: Liazon
description: >-
  Liazon was a Buffalo, New York based operator of private benefits exchanges,
  best known for the Bright Choices Exchange, which helped small and mid-sized
  employers move to a defined-contribution benefits model and let their employees
  shop for health, dental, vision, life, and disability coverage through an online
  marketplace. Backed by Bain Capital Ventures and Bessemer Venture Partners, the
  company was acquired by Towers Watson — now WTW — and no longer operates as an
  independent business. As of a 2026-07-19 probe, liazon.com publishes no A record
  and serves no website over HTTP or HTTPS, while the domain's MX records resolve
  to willistowerswatson-com.mail.protection.outlook.com and the registration is
  held through MarkMonitor, indicating WTW retains the domain defensively rather
  than operating a product on it. There is no Liazon developer portal,
  documentation, API reference, SDK, or public API surface to catalog. This
  profile is retained as an acquired-company record; enrichment beyond
  domain-level DNS evidence is not applicable.
